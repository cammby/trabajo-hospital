<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: hsl(0, 1%, 49%);
        }

        .contenedor{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        .campo{
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
            padding-left: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        .boton{
            width: 100%;
            height: 40px;
            border: none;
            background-color: #4a90e2;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .boton:hover{
            background-color: #357abd;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h2>Sign In</h2>

        <input type="text" placeholder="DNI" class="campo">
        <input type="text" placeholder="Plan medico Prepago(opcional)" class="campo">
        <input type="email" placeholder="ingrese su Email" class="campo">
        <input type="password" placeholder="Contraseña" class="campo">
        <input type="text" placeholder="vuelva a ingresar su contraseña" class="campo">
        <input type="text" placeholder="fecha de nacimiento" class="campo">

        <button class="boton">Ingresar</button>
    </div>

</body>
</html>
