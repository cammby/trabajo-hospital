<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hospital San Lucas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:url('https://www.santafe.gob.ar/noticias/media/cache/thumb_no_full/recursos/fotos/2025/11/2025-11-27NID_284664O_1.jpeg') no-repeat center center;
            background-size:cover;
            position:relative;
        }
        body::before{
            content:'';
            position:absolute;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,.45);
            z-index:1;
        }
        .login-container{
            background:rgba(255,255,255,.95);
            padding:40px 35px;
            border-radius:12px;
            width:100%;
            max-width:380px;
            box-shadow:0 10px 25px rgba(0,0,0,.3);
            position:relative;
            z-index:2;
            text-align:center;
        }
        .login-container h2{
            margin-bottom:25px;
            color:#1e3a8a;
            font-size:28px;
        }
        .input-group{
            margin-bottom:20px;
            text-align:left;
        }
        .input-group label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
            color:#334155;
        }
        .input-wrapper{
            position:relative;
        }
        .input-group input{
            width:100%;
            padding:12px 15px;
            border:2px solid #cbd5e1;
            border-radius:8px;
            font-size:16px;
            transition:.3s;
        }
        .input-group input:focus{
            outline:none;
            border-color:#1e40af;
            box-shadow:0 0 0 3px rgba(30,64,175,.2);
        }
        .toggle-password{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:20px;
            color:#64748b;
        }
        .btn-login{
            width:100%;
            padding:14px;
            background:#1e40af;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }
        .btn-login:hover{ background:#1e3a8a; }

        .register-link {
            margin-top: 20px;
            font-size: 15px;
            color: #64748b;
        }
        .register-link a {
            color: #1e40af;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .forgot-password-link {
            margin-top: 10px;
            font-size: 15px;
        }
        .forgot-password-link a {
            color: #1e40af;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-password-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm">
        <div class="input-group">
            <label for="username">Usuario o Email</label>
            <input type="text" id="username" placeholder="Ingrese su usuario o email" required>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                <span class="toggle-password" id="toggleBtn">
                    <i class="fa-solid fa-eye-slash"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn-login">Iniciar sesión</button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta? 
        <a href="/sign">Regístrate aquí</a>
    </div>

    <div class="forgot-password-link">
        <a href="/recuperar-contraseña">Olvidé mi contraseña</a>
    </div>

    <div class="footer-info" style="margin-top:25px; font-size:13px; color:#64748b;">
        <p><strong>Hospital San Lucas</strong></p>
        <p>Teléfono: (011)1234-5678 | Email: contacto@sanlucas.com</p>
    </div>
</div>

<script>
    // Toggle contraseña
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("toggleBtn");

    toggleBtn.addEventListener("click", () => {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleBtn.innerHTML = '<i class="fa-solid fa-eye"></i>';
        } else {
            passwordInput.type = "password";
            toggleBtn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
        }
    });

    // Login con control de acceso
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const login_input = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!login_input || !password) {
            alert("Por favor complete todos los campos");
            return;
        }

        try {
            const respuesta = await fetch("http://127.0.0.1:8000/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ login_input, password })
            });

            const resultado = await respuesta.json();

            if (respuesta.ok) {

                // ==================== CONTROL DE ACCESO ====================
                const esAdmin = (login_input.toLowerCase() === "admin" && password === "admin123");

                localStorage.setItem("socio_id", resultado.id);
                localStorage.setItem("userId", resultado.id);
                localStorage.setItem("usuario", JSON.stringify(resultado));

                if (esAdmin) {
                    localStorage.setItem("userRole", "admin");
                    alert("¡Bienvenido Administrador!");
                    window.location.href = "/turnos_hospital";
                } else {
                    localStorage.setItem("userRole", "paciente");
                    alert("¡Bienvenido!");
                    window.location.href = "/dashboard";
                }

            } else {
                alert(resultado.detail || "Credenciales incorrectas");
            }

        } catch (error) {
            console.error(error);
            alert("No se pudo conectar con el servidor. Asegúrate que FastAPI esté corriendo.");
        }
    });
</script>

</body>
</html>
