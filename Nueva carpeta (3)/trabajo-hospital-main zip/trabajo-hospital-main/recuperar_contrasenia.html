<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: rgb(233, 235, 238)
        }

        h1{
            text-align: center;
            padding: 20px;
            color: #000000;
        }

        .container{
            width: 500px;
            padding: 20px;
            margin: auto;
            background: white;
        }

        h2{
            font-size: 16px;
            text-align: center;
            padding: 20px 10px;
        }

        .correo{
            width: 100%;
            border: none;
            background: none;
            border-bottom: solid hwb(139 27% 52%) 1px;
            padding: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        .correo:focus{
            border-bottom: solid rgb(0, 42, 255) 1px;
        }

        .form__button{
            display: flex;
            justify-content: space-between;
        }

        .salir{
            text-decoration: none;
            background: red;
            padding: 5px 20px;
            color: white;
            font-size: 14px;
        }

        .salir:hover{
            background: #850d0d;
        }

        .enviar{
            background: green;
            padding: 8px 15px;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .enviar:hover{
            background: hsl(120, 84%, 15%);
        }
    </style>

</head>

<body>

    <h1>RECUPERAR CONTRASEÑA</h1>

    <div class="container">
        <h2>ingrese el correo con el que se ha registrado</h2>

        <form class="form" onsubmit="enviarLink(event)">
            
            <div class="form__correo">
                <input type="email" placeholder="ingrese su correo" class="correo" required>
            </div>

            <div class="form__button">
                <a class="salir" href="javascript:history.back()">volver</a>
                <button type="submit" class="enviar">Enviar link</button>
            </div>

        </form>
    </div>

    <script>
        function enviarLink(event) {
            event.preventDefault();
            alert("Se envió un link al correo");
        }
    </script>

</body>
</html>
