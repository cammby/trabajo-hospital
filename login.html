<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hospital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://www.santafe.gob.ar/noticias/media/cache/thumb_no_full/recursos/fotos/2025/11/2025-11-27NID_284664O_1.jpeg') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* Overlay oscuro para mejorar legibilidad */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 25px;
            color: #1e3a8a;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.2);
        }

        /* Icono de ojo */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            color: #64748b;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1e40af;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #1e3a8a;
        }

        .footer-info {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
        }

        .footer-info a {
            color: #1e40af;
            text-decoration: none;
        }
    </style>
    <!-- Font Awesome para el icono del ojo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        
        <form>
            <div class="input-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Ingrese su usuario" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                    <span class="toggle-password" id="toggleBtn">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>
                </div>
            </div>
             <p style="margin-top: 8px; font-size: 13px;">
                <a href="recuperar contraseña.html" style="color: #1e40af; text-decoration: none;">
                 ¿Olvidaste tu contraseña?
                 </a>
            </p>

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="footer-info">
            <p><strong id="hospital-name">HP hospital</strong></p>
            <p id="hospital-contact">Teléfono: (011) 1234-5678 | Email: HP@hospital.com</p>
        </div>
    </div>

    <script>
        // Toggle mostrar/ocultar contraseña
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggleBtn');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            }
        });
    </script>
</body>
</html>
